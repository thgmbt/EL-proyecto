<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Por definir</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <main class="tarjeta pagina-galeria">
    <nav class="barra-navegacion" aria-label="Navegación principal">
      <a href="{{ url_for('inicio') }}">Inicio</a>
      <a href="{{ url_for('por_definir') }}" aria-current="page">Por definir</a>
    </nav>

    <p class="etiqueta">Un futuro juntos</p>
    <h1>Así podría verse 💜</h1>
    <p class="intro">Algunos momentos bonitos para imaginar todo lo que nos queda por vivir.</p>

    <section class="galeria-parejas" aria-label="Galería de parejas">
      <figure class="foto-pareja">
        <img src="{{ url_for('static', filename='img/pareja-1.jpg') }}"
          alt="Dos manos formando un corazón frente a la luz del atardecer" loading="lazy">
        <figcaption>Un corazón y mil recuerdos</figcaption>
      </figure>
      <figure class="foto-pareja">
        <img src="{{ url_for('static', filename='img/pareja-2.jpg') }}"
          alt="Una pareja caminando junta por el mar al atardecer" loading="lazy">
        <figcaption>Aventuras de la mano</figcaption>
      </figure>
      <figure class="foto-pareja">
        <img src="{{ url_for('static', filename='img/pareja-3.jpg') }}"
          alt="Una pareja compartiendo un momento especial bajo luces cálidas" loading="lazy">
        <figcaption>Momentos para recordar</figcaption>
      </figure>
    </section>

    <p class="credito-fotos">
      Fotos de ejemplo:
      <a href="https://unsplash.com/license" target="_blank" rel="noopener noreferrer">Unsplash</a>
      y
      <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">Pexels</a>.
    </p>
  </main>
</body>

</html>
